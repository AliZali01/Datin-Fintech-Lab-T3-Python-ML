[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nyc311-data-factory"
version = "0.1.0"
description = "A reproducible data factory for NYC 311 service requests."
requires-python = ">=3.11"
dependencies = ["requests==2.34.2"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]


[project.optional-dependencies]
database = [
    "pandas>=2.2",
    "SQLAlchemy>=2.0,<3",
    "psycopg[binary]>=3.2,<4",
]
